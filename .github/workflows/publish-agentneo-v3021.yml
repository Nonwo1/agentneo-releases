name: Publish AgentNEO v3.0.21

on:
  push:
    paths:
      - "release-staging/3.0.21/READY.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update v3.0.21 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 3.0.21 >/dev/null 2>&1; then
            gh release edit 3.0.21 \
              --title "AgentNEO v3.0.21" \
              --notes-file release-staging/3.0.21/RELEASE_NOTES_v3.0.21.md
          else
            gh release create 3.0.21 \
              --target main \
              --title "AgentNEO v3.0.21" \
              --notes-file release-staging/3.0.21/RELEASE_NOTES_v3.0.21.md
          fi

      - name: Verify uploaded cumulative updater
        id: asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify
          if ! gh release download 3.0.21 \
              --pattern "AgentNEO_v3.0.21_Update.zip" \
              --dir verify \
              --clobber; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "AgentNEO_v3.0.21_Update.zip has not been uploaded yet. Stable feed remains unchanged."
            exit 0
          fi

          echo "90d1fcb01b56482a928b1eac8485a37e3af604e111428cfdf8473d23926be65b  verify/AgentNEO_v3.0.21_Update.zip" | sha256sum --check --strict
          unzip -t verify/AgentNEO_v3.0.21_Update.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('verify/AgentNEO_v3.0.21_Update.zip') as z:
              m=json.loads(z.read('manifest.json'))
          assert m.get('version') == '3.0.21', m
          assert m.get('cumulative') is True, m
          assert m.get('minimum_supported_version') == '3.0.11', m
          assert m.get('cumulative_from') == '3.0.11', m
          print('v3.0.21 cumulative manifest validation PASS')
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        if: steps.asset.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload 3.0.21 \
            release-staging/3.0.21/SHA256SUMS.txt \
            release-staging/3.0.21/AgentNEO_v3.0.21_GitHub_Validation.txt \
            release-staging/3.0.21/AgentNEO_v3.0.21_Cumulative_Validation.txt \
            release-staging/3.0.21/RELEASE_NOTES_v3.0.21.md \
            release-staging/3.0.21/latest.json \
            --clobber

      - name: Re-download and verify published updater
        if: steps.asset.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-final
          mkdir -p verify-final
          gh release download 3.0.21 \
            --pattern "AgentNEO_v3.0.21_Update.zip" \
            --dir verify-final \
            --clobber
          echo "90d1fcb01b56482a928b1eac8485a37e3af604e111428cfdf8473d23926be65b  verify-final/AgentNEO_v3.0.21_Update.zip" | sha256sum --check --strict
          unzip -t verify-final/AgentNEO_v3.0.21_Update.zip

      - name: Promote signed stable feed
        if: steps.asset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cp release-staging/3.0.21/latest.json latest.json
          cp release-staging/3.0.21/SHA256SUMS.txt SHA256SUMS.txt
          cp release-staging/3.0.21/README.md README.md
          cp release-staging/3.0.21/CUMULATIVE_UPDATE_POLICY.md CUMULATIVE_UPDATE_POLICY.md
          mkdir -p release-notes
          cp release-staging/3.0.21/RELEASE_NOTES_v3.0.21.md release-notes/v3.0.21.md
          printf '%s\n' \
            'AgentNEO v3.0.21 publication verified.' \
            'Updater SHA-256: 90d1fcb01b56482a928b1eac8485a37e3af604e111428cfdf8473d23926be65b' \
            'Stable feed promoted only after downloading and re-verifying the GitHub release asset.' \
            > release-staging/3.0.21/PUBLISHED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json SHA256SUMS.txt README.md CUMULATIVE_UPDATE_POLICY.md release-notes/v3.0.21.md release-staging/3.0.21/PUBLISHED.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish AgentNEO v3.0.21 stable feed [skip ci]"
            git push origin HEAD:main
          fi
