name: Assemble AgentNEO v3.0.7 release

on:
  push:
    branches: [main]
    paths:
      - 'release-staging/v3.0.7/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify signed update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cat release-staging/v3.0.7/parts/part*.b64 | base64 --decode > releases/AgentNEO_v3.0.7.aneoupdate
          echo "0d95accd1b5086f6c9b719bed8e5a9f965d85c08ce35065ef9ca94513d933a90  releases/AgentNEO_v3.0.7.aneoupdate" | sha256sum -c -
          cp release-staging/v3.0.7/latest.json latest.json
          cp release-staging/v3.0.7/SHA256SUMS.txt SHA256SUMS.txt
          cp release-staging/v3.0.7/release-notes.md release-notes/v3.0.7.md
          rm -rf release-staging/v3.0.7
      - name: Publish binary and feed atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AgentNEO Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add releases/AgentNEO_v3.0.7.aneoupdate latest.json SHA256SUMS.txt release-notes/v3.0.7.md release-staging/v3.0.7 || true
          git commit -m "Publish AgentNEO v3.0.7 signed update"
          git push
