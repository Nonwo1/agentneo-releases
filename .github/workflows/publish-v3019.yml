name: Publish AgentNEO 3.0.19

on:
  push:
    paths:
      - 'release-staging/3.0.19/READY.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download trusted 3.0.18 updater base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _base_v3018 _publish_v3019 _verify_v3019
          mkdir -p _base_v3018 _publish_v3019 _verify_v3019
          gh release download 3.0.18 \
            --pattern 'AgentNEO_v3.0.18_Update.zip' \
            --dir _base_v3018 \
            --repo "${{ github.repository }}"
          echo '459dc2c517660492f9937f4653cc99abc3eaf4dc4211eb17ad6de87a48e9ca25  _base_v3018/AgentNEO_v3.0.18_Update.zip' | sha256sum -c -

      - name: Reconstruct exact 3.0.19 updater asset
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zstd; }
          cat release-staging/3.0.19/patch.b64.part* \
            | tr -d '\n\r' \
            | base64 -d > _publish_v3019/update-from-3018.patch.zst
          zstd -d \
            --patch-from=_base_v3018/AgentNEO_v3.0.18_Update.zip \
            _publish_v3019/update-from-3018.patch.zst \
            -f -o _publish_v3019/AgentNEO_v3.0.19_Update.zip
          echo 'a0a474da43723fdeb00745f9200e0995f9b6674b7ce5b9afd6fcc1602c995732  _publish_v3019/AgentNEO_v3.0.19_Update.zip' | sha256sum -c -

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 3.0.19 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload 3.0.19 \
              _publish_v3019/AgentNEO_v3.0.19_Update.zip \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create 3.0.19 \
              _publish_v3019/AgentNEO_v3.0.19_Update.zip \
              --title 'AgentNEO v3.0.19' \
              --notes-file release-staging/3.0.19/release-notes-v3.0.19.md \
              --repo "${{ github.repository }}"
          fi

      - name: Verify published updater asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _verify_v3019
          mkdir _verify_v3019
          gh release download 3.0.19 \
            --pattern 'AgentNEO_v3.0.19_Update.zip' \
            --dir _verify_v3019 \
            --repo "${{ github.repository }}"
          echo 'a0a474da43723fdeb00745f9200e0995f9b6674b7ce5b9afd6fcc1602c995732  _verify_v3019/AgentNEO_v3.0.19_Update.zip' | sha256sum -c -

      - name: Publish signed update feed last
        run: |
          set -euo pipefail
          cp release-staging/3.0.19/latest.json latest.json
          cp release-staging/3.0.19/SHA256SUMS.txt SHA256SUMS.txt
          cp release-staging/3.0.19/release-notes-v3.0.19.md release-notes/v3.0.19.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json SHA256SUMS.txt release-notes/v3.0.19.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish AgentNEO v3.0.19 signed update feed'
            git push
          fi
