name: Publish refreshed AgentNEO 3.0.13

on:
  push:
    paths:
      - 'release-staging/3.0.13/READY.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current 3.0.13 base assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _base _publish_v3013 _verify_release
          mkdir _base _publish_v3013 _verify_release
          gh release download 3.0.13 --repo "${{ github.repository }}" \
            --pattern 'AgentNEO_v3.0.13_Update.zip' \
            --pattern 'AgentNEO_v3.0.13.exe' --dir _base

      - name: Reconstruct runtime patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat release-staging/3.0.13/patch.gz.b64.part00 \
              release-staging/3.0.13/patch.gz.b64.part01 > /tmp/agentneo-v3013.patch.gz.b64
          for sha in 9f0c478e25e377ab7af263ace00588a28128f930 8fae6433606c72e1c38150a41c3a18c451c393da; do
            gh api "repos/${{ github.repository }}/git/blobs/$sha" --jq -r .content \
              | tr -d '\n' | base64 -d >> /tmp/agentneo-v3013.patch.gz.b64
          done
          base64 -d /tmp/agentneo-v3013.patch.gz.b64 | gzip -d > /tmp/agentneo-v3013.patch

      - name: Rebuild deterministic 3.0.13 assets
        run: |
          set -euo pipefail
          python release-staging/3.0.13/rebuild-v3013.py \
            _base/AgentNEO_v3.0.13_Update.zip \
            _base/AgentNEO_v3.0.13.exe \
            /tmp/agentneo-v3013.patch \
            _publish_v3013

      - name: Replace 3.0.13 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload 3.0.13 \
            _publish_v3013/AgentNEO_v3.0.13_Update.zip \
            _publish_v3013/AgentNEO_v3.0.13.exe \
            --clobber --repo "${{ github.repository }}"

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 3.0.13 --repo "${{ github.repository }}" \
            --pattern 'AgentNEO_v3.0.13_Update.zip' \
            --pattern 'AgentNEO_v3.0.13.exe' --dir _verify_release
          echo '5e7c39b8ad35aaffe26cee7e57d4f2803eeecb3a2605fb390996dec9c5de79cf  _verify_release/AgentNEO_v3.0.13_Update.zip' | sha256sum -c -
          echo 'b99995f7137687ce8023d087bedcabdec151e3bbd0b1a8d474a9bf721f4daa0d  _verify_release/AgentNEO_v3.0.13.exe' | sha256sum -c -

      - name: Publish signed update feed last
        run: |
          set -euo pipefail
          cp release-staging/3.0.13/latest.json latest.json
          cp release-staging/3.0.13/SHA256SUMS.txt SHA256SUMS.txt
          cp release-staging/3.0.13/release-notes-v3.0.13.md release-notes/v3.0.13.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json SHA256SUMS.txt release-notes/v3.0.13.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish refreshed AgentNEO v3.0.13 Media Studio build'
            git push
          fi
