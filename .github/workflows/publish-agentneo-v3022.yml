name: Publish AgentNEO v3.0.22

on:
  push:
    paths:
      - "release-staging/3.0.22/READY.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify uploaded v3.0.22 cumulative updater
        id: asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 3.0.22 >/dev/null
          rm -rf verify
          mkdir -p verify
          gh release download 3.0.22 \
            --pattern "AgentNEO_v3.0.22_Update.zip" \
            --dir verify \
            --clobber

          echo "653d461311ac40ea6f39e677d092018b482be874845a0666b61e245af2ae8efa  verify/AgentNEO_v3.0.22_Update.zip" | sha256sum --check --strict
          unzip -t verify/AgentNEO_v3.0.22_Update.zip

          python3 - <<'PY'
          import json, zipfile
          path='verify/AgentNEO_v3.0.22_Update.zip'
          with zipfile.ZipFile(path) as z:
              m=json.loads(z.read('manifest.json'))
          assert m.get('format') == 'agentneo-update-v1', m
          assert m.get('version') == '3.0.22', m
          assert m.get('cumulative') is True, m
          assert m.get('cumulative_from') == '3.0.11', m
          assert m.get('minimum_supported_version') == '3.0.11', m
          tested=set(m.get('baseline_versions_tested') or m.get('tested_baselines') or [])
          required={f'3.0.{n}' for n in range(11,22)}
          assert required.issubset(tested), sorted(required-tested)
          print('v3.0.22 cumulative manifest validation PASS')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('release-staging/3.0.22/latest.json').read_text())
          r=feed['channels']['stable']
          assert feed.get('format') == 'agentneo-update-feed-v1'
          assert r.get('version') == '3.0.22'
          assert r.get('package_url') == 'https://github.com/Nonwo1/agentneo-releases/releases/download/3.0.22/AgentNEO_v3.0.22_Update.zip'
          assert r.get('package_sha256') == '653d461311ac40ea6f39e677d092018b482be874845a0666b61e245af2ae8efa'
          assert isinstance(r.get('signature'), str) and len(r['signature']) > 40
          print('staged feed metadata validation PASS')
          PY

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Update release notes and attach verification metadata
        if: steps.asset.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit 3.0.22 \
            --title "AgentNEO v3.0.22" \
            --notes-file release-staging/3.0.22/RELEASE_NOTES_v3.0.22.md

          gh release upload 3.0.22 \
            release-staging/3.0.22/SHA256SUMS.txt \
            release-staging/3.0.22/AgentNEO_v3.0.22_Validation.txt \
            release-staging/3.0.22/AgentNEO_v3.0.22_Cumulative_Validation.txt \
            release-staging/3.0.22/RELEASE_NOTES_v3.0.22.md \
            release-staging/3.0.22/latest.json \
            --clobber

      - name: Re-download and verify published updater again
        if: steps.asset.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-final
          mkdir -p verify-final
          gh release download 3.0.22 \
            --pattern "AgentNEO_v3.0.22_Update.zip" \
            --dir verify-final \
            --clobber
          echo "653d461311ac40ea6f39e677d092018b482be874845a0666b61e245af2ae8efa  verify-final/AgentNEO_v3.0.22_Update.zip" | sha256sum --check --strict
          unzip -t verify-final/AgentNEO_v3.0.22_Update.zip

      - name: Promote signed stable auto-update feed
        if: steps.asset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cp release-staging/3.0.22/latest.json latest.json
          cp release-staging/3.0.22/SHA256SUMS.txt SHA256SUMS.txt
          cp release-staging/3.0.22/README.md README.md
          cp release-staging/3.0.22/CUMULATIVE_UPDATE_POLICY.md CUMULATIVE_UPDATE_POLICY.md
          mkdir -p release-notes
          cp release-staging/3.0.22/RELEASE_NOTES_v3.0.22.md release-notes/v3.0.22.md
          printf '%s\n' \
            'AgentNEO v3.0.22 publication verified.' \
            'Updater SHA-256: 653d461311ac40ea6f39e677d092018b482be874845a0666b61e245af2ae8efa' \
            'GitHub release asset downloaded and verified twice before stable-feed promotion.' \
            > release-staging/3.0.22/PUBLISHED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json SHA256SUMS.txt README.md CUMULATIVE_UPDATE_POLICY.md release-notes/v3.0.22.md release-staging/3.0.22/PUBLISHED.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish AgentNEO v3.0.22 stable feed [skip ci]"
            git push origin HEAD:main
          fi
