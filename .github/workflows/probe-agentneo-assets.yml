name: Probe AgentNEO release assets

on:
  push:
    paths:
      - 'release-staging/PROBE_CURRENT.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-staging
          {
            echo '3.0.29:'
            gh release view 3.0.29 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            echo '3.0.28:'
            gh release view 3.0.28 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            echo '3.0.27:'
            gh release view 3.0.27 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            echo '3.0.26:'
            gh release view 3.0.26 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
          } > release-staging/PROBE_CURRENT_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-staging/PROBE_CURRENT_RESULT.txt
          git commit -m 'Probe AgentNEO release assets for current releases' || true
          git push
